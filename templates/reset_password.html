{% extends 'base.html' %}
{% block title %}Redefinir senha{% endblock %}
{% block content %}
<section class="auth-card" aria-labelledby="reset-title">
  <p class="eyebrow">NOVA SENHA</p>
  <h1 id="reset-title">Crie uma nova<br><em>senha.</em></h1>
  <p class="description">Digite o código recebido por e-mail e escolha sua nova senha.</p>
  {% if error %}<p class="message error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/admin/redefinir-senha">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field"><label for="code">Código recebido por e-mail</label><input class="code-input" id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="one-time-code" required></div>
    <div class="field"><label for="password">Nova senha <span>(mínimo 8 caracteres)</span></label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="256" required></div>
    <div class="field"><label for="password_confirmation">Confirmação da nova senha</label><input id="password_confirmation" name="password_confirmation" type="password" autocomplete="new-password" minlength="8" maxlength="256" required></div>
    <button class="button" type="submit">Salvar nova senha <span aria-hidden="true">↗</span></button>
  </form>
</section>
{% endblock %}
