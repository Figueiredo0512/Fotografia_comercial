{% extends 'base.html' %}
{% block title %}Esqueci minha senha{% endblock %}
{% block content %}
<section class="auth-card" aria-labelledby="forgot-title">
  <p class="eyebrow">RECUPERAR ACESSO</p>
  <h1 id="forgot-title">Redefina sua<br><em>senha.</em></h1>
  <p class="description">Informe o e-mail do seu cadastro para receber um código de redefinição.</p>
  {% if error %}<p class="message error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/admin/esqueci-senha">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" value="{{ email }}" required></div>
    <button class="button" type="submit">Enviar código <span aria-hidden="true">↗</span></button>
  </form>
  <a class="return-link" href="/admin/login">Voltar ao login</a>
</section>
{% endblock %}
